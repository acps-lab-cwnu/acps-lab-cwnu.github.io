name: Validate data
# data/*.js 문법 오류(쉼표 누락 등)가 있으면 실패하고 GitHub이 이메일로 알려줍니다.
on:
  push:
    paths: ['data/**']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node -e '
            global.window = {};
            for (const f of require("fs").readdirSync("data")) require("./data/" + f);
            const n = k => (Array.isArray(window[k]) ? window[k] : window[k].journal).length;
            for (const k of ["PUBLICATIONS", "PROJECTS", "NEWS"]) console.log(k, n(k));
          '
